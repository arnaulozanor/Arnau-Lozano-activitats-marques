<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validació sense JS</title>
</head>
<body>
  <h1>Formulari amb validació</h1>
  <form action="#" method="post">
    <p>
      <label for="nom">Nom (obligatori):</label><br>
      <input type="text" id="nom" name="nom" required maxlength="50">
    </p>
    <p>
      <label for="email">Correu electrònic:</label><br>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="password">Contrasenya (mínim 8 caràcters):</label><br>
      <input type="password" id="password" name="password" required minlength="8">
    </p>
    <p>
      <label for="telefon">Telèfon (9 dígits):</label><br>
      <input type="tel" id="telefon" name="telefon" required pattern="[0-9]{9}" maxlength="9" title="Introdueix exactament 9 dígits numèrics">
    </p>
    <p>
      <label for="edat">Edat (18-99):</label><br>
      <input type="number" id="edat" name="edat" min="18" max="99" step="1">
    </p>
    <button type="submit">Enviar</button>
  </form>
</body>
</html>
