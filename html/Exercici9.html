<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacta'm</title>
</head>
<body>
  <h1>Contacta'm</h1>
  <form action="#" method="post">
    <p>
      <label for="nom">Nom:</label><br>
      <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom">
    </p>
    <p>
      <label for="email">Correu electrònic:</label><br>
      <input type="email" id="email" name="email" placeholder="Escriu el teu correu electrònic" required>
    </p>
    <p>
      <label for="missatge">Missatge:</label><br>
      <textarea id="missatge" name="missatge" rows="5" cols="40" placeholder="Escriu el teu missatge"></textarea>
    </p>
    <button type="submit">Enviar</button>
  </form>
</body>
</html>
