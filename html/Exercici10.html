<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registre</title>
</head>
<body>
  <h1>Crea el teu compte</h1>
  <form action="#" method="post">
    <p>
      <label for="nom">Nom:</label><br>
      <input type="text" id="nom" name="nom">
    </p>
    <p>
      <label for="email">Correu electrònic:</label><br>
      <input type="email" id="email" name="email">
    </p>
    <p>
      <label for="password">Contrasenya:</label><br>
      <input type="password" id="password" name="password">
    </p>
    <p>
      <input type="checkbox" id="termes" name="termes">
      <label for="termes">Accepto els termes i condicions</label>
    </p>
    <button type="submit">Registrar-me</button>
  </form>
</body>
</html>
