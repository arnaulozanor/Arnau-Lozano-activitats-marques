<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimèdia</title>
</head>
<body>
  <h1>El meu contingut favorit</h1>
  <h2>Vídeo de YouTube</h2>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/2XJv7rCUmvA?si=z0ZFJE3O_TfexXr_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <h2>Vídeo local</h2>
  <video controls width="560">
    <source src="../video/Ignited Chica active.mp4" type="video/mp4">
  </video>
  <h2>La meva cançó</h2>
  <audio controls>
    <source src="../audio/Happy Vocal Encore.ogg" type="audio/ogg">
  </audio>
  <p>He triat aquest contingut perquè la cançó de video em fa riure i tant l'audio com el video local em recorda al que m'agrada fer.</p>
</body>
</html>
